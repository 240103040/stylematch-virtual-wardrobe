name: stylematch-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stylematch_prod
      POSTGRES_USER: stylematch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylematch -d stylematch_prod"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://stylematch:${POSTGRES_PASSWORD}@db:5432/stylematch_prod
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prod_postgres_data:
