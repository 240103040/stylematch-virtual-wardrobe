services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stylematch_dev
      POSTGRES_USER: stylematch
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylematch -d stylematch_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://stylematch:dev_password@db:5432/stylematch_dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  dev_postgres_data:
